  <style>
    :root {
      --ink: #182119;
      --ink-2: #223026;
      --paper: #fbf6ea;
      --paper-2: #f1e8d4;
      --gold: #ab8148;
      --gold-deep: #87642f;
      --gold-lt: #d9b98a;
      --rose: #bd8778;
      --text-1: #292520;
      --text-2: #7c7565;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Work Sans", sans-serif;
      background:
        radial-gradient(
          ellipse 60% 50% at 15% -5%,
          #263a2d 0%,
          transparent 60%
        ),
        radial-gradient(
          ellipse 60% 50% at 88% 105%,
          #263a2d 0%,
          transparent 60%
        ),
        var(--ink);

      color: var(--text-1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
    }

    .frame {
      width: 100%;
      max-width: 420px;
    }

    .eyebrow-top {
      text-align: center;
      color: var(--gold-lt);
      font-size: 11px;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .stage {
      perspective: 1700px;
    }

    .card-inner {
      position: relative;
      width: 100%;
      min-height: 560px;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(.4,.15,.2,1);
    }

    .card-inner.revealed {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background:
        radial-gradient(
          120% 140% at 50% -10%,
          var(--paper-2) 0%,
          var(--paper) 45%
        );

      border-radius: 2px;
      box-shadow:
        0 40px 70px -25px rgba(0,0,0,.55);

      padding: 38px 30px 30px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .face::before {
      content: "";
      position: absolute;
      inset: 9px;
      border: 1px solid rgba(171,129,72,.4);
      pointer-events: none;
    }

    .card-back {
      transform: rotateY(180deg);
      text-align: center;
      align-items: center;
    }

    .card-back::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("couple.jpeg");
      background-size: cover;
      background-position: center 20%;
      opacity: 0.18;
      pointer-events: none;
    }

    .card-back > * {
      position: relative;
      z-index: 1;
    }

    .headline {
      font-family: "Fraunces", serif;
      font-weight: 600;
      font-size: 31px;
      line-height: 1.15;
      text-align: center;
      margin: 0 0 6px;
    }

    .headline em {
      font-style: italic;
      color: var(--gold-deep);
    }

    .subline {
      text-align: center;
      color: var(--text-2);
      font-size: 13.5px;
      margin-bottom: 28px;
    }

    .field {
      position: relative;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      font-family: "Work Sans", sans-serif;
      font-size: 16px;
      padding: 12px 4px 10px;
      border: none;
      border-bottom: 1.5px solid #ddd2b8;
      background: transparent;
      outline: none;
      color: var(--text-1);
    }

    .field input::placeholder {
      color: #a79c81;
    }

    .field .underline {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 1.5px;
      width: 0;
      background: linear-gradient(
        90deg,
        var(--gold),
        var(--gold-deep)
      );
      transition: width .4s ease;
    }

    .field input:focus ~ .underline {
      width: 100%;
    }

    .results {
      margin-top: 14px;
      flex: 1;
      overflow-y: auto;
    }

    .result-row {
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid #ede3ca;
      padding: 12px 4px;
      font-family: "Work Sans", sans-serif;
      font-size: 14.5px;
      color: var(--text-1);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .empty-hint,
    .no-match {
      color: var(--text-2);
      font-size: 13px;
      text-align: center;
      margin-top: 24px;
      line-height: 1.6;
      font-style: italic;
    }

    .back-eyebrow {
      color: var(--text-2);
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      margin-top: 20px;
      margin-bottom: 20px;
    }

    .suggested-results {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      max-height: 340px;
    }

    .suggested-result {
      width: 100%;
      background: rgba(251,246,234,.8);
      border: 1px solid rgba(171,129,72,.4);
      color: var(--text-1);
      padding: 14px 16px;
      margin-bottom: 10px;
      cursor: pointer;
      font-family: "Work Sans", sans-serif;
      font-size: 14px;
      text-align: left;
      transition: .2s ease;
    }

    .suggested-result:hover {
      background: rgba(171,129,72,.15);
    }

    .guest-result {
      width: 100%;
      text-align: center;
      display: none;
    }

    .guest-result.active {
      display: block;
    }

    .seal {
      width: 76px;
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      position: relative;
    }

    .seal svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .seal-mark {
      font-family: "Fraunces", serif;
      font-style: italic;
      font-size: 22px;
      color: var(--gold-deep);
      position: relative;
    }

    .guest-name {
      font-family: "Fraunces", serif;
      font-size: 23px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    .table-label {
      font-size: 11px;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--text-2);
      margin-bottom: 6px;
    }

    .table-num {
      font-family: "Fraunces", serif;
      font-weight: 700;
      font-size: 54px;
      line-height: 1;
      margin-bottom: 12px;
    }

    .again-btn {
      margin-top: 20px;
      background: rgba(251,246,234,.8);
      border: 1px solid var(--gold);
      color: var(--gold-deep);
      font-family: "Work Sans", sans-serif;
      font-size: 12.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 11px 24px;
      cursor: pointer;
    }

    .foot-note {
      text-align: center;
      color: rgba(251,247,239,.42);
      font-size: 11.5px;
      margin-top: 22px;
      font-style: italic;
      font-family: "Fraunces", serif;
    }
  </style>
</head>

<body>

  <div class="frame">

    <div class="eyebrow-top">
      You're Invited
    </div>

    <div class="stage">

      <div class="card-inner" id="cardInner">

        <!-- FRONT CARD -->
        <div class="face card-front">

          <div class="headline">
            Find <em>Your</em> Table
          </div>

          <div class="subline">
            Type your name as it appears on your invitation
          </div>

          <form id="searchForm">

            <div class="field">
              <input
                type="text"
                id="searchInput"
                placeholder="Start typing your name…"
                autocomplete="off"
                autocapitalize="words"
                enterkeyhint="search"
              >

              <div class="underline"></div>
            </div>

            <!-- Hidden submit button -->
            <button type="submit" hidden>
              Search
            </button>

          </form>

          <div class="results" id="results">

            <div
              class="empty-hint"
              id="emptyHint"
            >
              Your seat is waiting — just start typing.
            </div>

          </div>

        </div>


        <!-- BACK CARD -->
        <div class="face card-back">

          <!-- SUGGESTED GUESTS -->
          <div id="suggestionsView">

            <div class="back-eyebrow">
              Suggested Guests
            </div>

            <div
              class="suggested-results"
              id="suggestedResults"
            ></div>

          </div>


          <!-- SELECTED GUEST RESULT -->
          <div
            class="guest-result"
            id="guestResultView"
          >

            <div class="seal">

              <svg
                viewBox="0 0 76 76"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle
                  cx="38"
                  cy="38"
                  r="35"
                  stroke="#ab8148"
                  stroke-width="1.2"
                  fill="none"
                />

                <circle
                  cx="38"
                  cy="38"
                  r="29"
                  stroke="#ab8148"
                  stroke-width="0.8"
                  fill="none"
                />
              </svg>

              <span
                class="seal-mark"
                id="sealInitial"
              >
                A
              </span>

            </div>

            <div class="back-eyebrow">
              Welcome
            </div>

            <div
              class="guest-name"
              id="resultName"
            >
              Guest Name
            </div>

            <div class="table-label">
              Your Table
            </div>

            <div
              class="table-num"
              id="resultTable"
            >
              —
            </div>

            <div
              class="table-note"
              id="resultNote"
            ></div>

          </div>


          <button
            class="again-btn"
            id="againBtn"
            type="button"
          >
            Search Again
          </button>

        </div>

      </div>

    </div>

    <div class="foot-note">
      With love — see you at the celebration
    </div>

  </div>


  <script>

    const input = document.getElementById("searchInput");
    const searchForm = document.getElementById("searchForm");

    const resultsEl = document.getElementById("results");
    const emptyHint = document.getElementById("emptyHint");

    const cardInner = document.getElementById("cardInner");
    const againBtn = document.getElementById("againBtn");

    const suggestedResults =
      document.getElementById("suggestedResults");

    const suggestionsView =
      document.getElementById("suggestionsView");

    const guestResultView =
      document.getElementById("guestResultView");

    const resultName =
      document.getElementById("resultName");

    const resultTable =
      document.getElementById("resultTable");

    const resultNote =
      document.getElementById("resultNote");

    const sealInitial =
      document.getElementById("sealInitial");


    function normalize(str) {
      return str
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .trim();
    }


    function findMatches(query) {

      const q = normalize(query);

      if (!q) {
        return [];
      }

      return GUESTS.filter(guest => {

        const normalName = normalize(guest.name);

        // Normal name match
        if (normalName.includes(q)) {
          return true;
        }

        // Reversed name match
        const reversedName = normalName
          .split(/\s+/)
          .reverse()
          .join(" ");

        if (reversedName.includes(q)) {
          return true;
        }

        // Match all typed words
        const queryWords = q.split(/\s+/);

        return queryWords.every(word =>
          normalName.includes(word)
        );

      });
    }


    function renderResults(query) {

      resultsEl.innerHTML = "";

      if (!query.trim()) {
        resultsEl.appendChild(emptyHint);
        return;
      }

      const matches = findMatches(query);

      if (matches.length === 0) {

        const div = document.createElement("div");

        div.className = "no-match";

        div.innerHTML =
          `No guest found matching <strong>"${query}"</strong>.`;

        resultsEl.appendChild(div);

        return;
      }


      matches
        .slice(0, 8)
        .forEach(guest => {

          const button =
            document.createElement("button");

          button.type = "button";

          button.className = "result-row";

          button.innerHTML = `
            <span>${guest.name}</span>
            <span class="arrow">→</span>
          `;

          button.addEventListener("click", () => {
            showResult(guest);
          });

          resultsEl.appendChild(button);

        });
    }


    function showSuggestedResults(matches) {

      suggestedResults.innerHTML = "";

      suggestionsView.style.display = "block";

      guestResultView.classList.remove("active");


      if (matches.length === 0) {

        suggestedResults.innerHTML = `
          <div class="no-match">
            No guest found matching your search.
          </div>
        `;

      } else {

        matches
          .slice(0, 8)
          .forEach(guest => {

            const button =
              document.createElement("button");

            button.type = "button";

            button.className =
              "suggested-result";

            button.textContent =
              guest.name;

            button.addEventListener("click", () => {
              showResult(guest);
            });

            suggestedResults.appendChild(button);

          });
      }


      // Flip to the back card
      cardInner.classList.add("revealed");
    }


    function showResult(guest) {

      resultName.textContent =
        guest.name;

      resultTable.textContent =
        guest.table || "—";

      resultNote.textContent =
        guest.note || "";

      sealInitial.textContent =
        guest.name
          .trim()
          .charAt(0)
          .toUpperCase();


      // Hide suggested guest list
      suggestionsView.style.display = "none";

      // Show selected guest result
      guestResultView.classList.add("active");

      // Ensure back card is visible
      cardInner.classList.add("revealed");
    }


    function reset() {

      cardInner.classList.remove("revealed");

      input.value = "";

      suggestedResults.innerHTML = "";

      suggestionsView.style.display = "block";

      guestResultView.classList.remove("active");

      renderResults("");


      setTimeout(() => {
        input.focus();
      }, 700);
    }


    // Live suggestions on front card
    input.addEventListener("input", event => {
      renderResults(event.target.value);
    });

    // Dismiss mobile keyboard on Enter / Go key press
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    input.blur(); // Hides the mobile keyboard
  }
});

    // Submit using Enter
    searchForm.addEventListener("submit", event => {

      event.preventDefault();

      const query = input.value.trim();

      if (!query) {
        input.focus();
        return;
      }

      const matches = findMatches(query);

      // Show suggested guests on the back card
      showSuggestedResults(matches);

    });


    // Search again
    againBtn.addEventListener("click", reset);


    // Initial state
    renderResults("");
